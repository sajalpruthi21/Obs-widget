<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multichat Overlay Settings</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      height: 100vh;
      overflow: hidden;
      background: #181818;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #sidebar {
      width: 520px;
      min-width: 520px;
      height: 100vh;
      overflow-y: auto;
      background: #181818;
      border-right: 1px solid #2d2d2d;
      display: flex;
      flex-direction: column;
    }

    #pinned-header {
      position: sticky;
      top: 0;
      background: #181818;
      padding: 16px 20px;
      border-bottom: 1px solid #2d2d2d;
      z-index: 20;
    }

    #pinned-header h2 {
      font-size: 13px;
      font-weight: 600;
      color: #58a6ff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    #widget-url {
      width: 100%;
      padding: 9px 12px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #c9d1d9;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 12px;
      margin-bottom: 10px;
      outline: none;
    }

    #widget-url:focus {
      border-color: #58a6ff;
    }

    .btn-row {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
      border: 1px solid transparent;
      text-align: center;
    }

    .btn-copy {
      background: #238636;
      color: #ffffff;
      border-color: #2ea043;
    }

    .btn-copy:hover {
      background: #2ea043;
    }

    .btn-copy.copied {
      background: #1f6feb;
      border-color: #388bfd;
    }

    .btn-reset {
      background: #21262d;
      color: #c9d1d9;
      border-color: #30363d;
      flex: 0 0 auto;
    }

    .btn-reset:hover {
      background: #30363d;
      color: #f0f6fc;
    }

    #settings-content {
      padding: 16px 20px 60px 20px;
      flex: 1;
    }

    .group-container {
      margin-bottom: 24px;
      background: #1e1e1e;
      border: 1px solid #2d2d2d;
      border-radius: 8px;
      overflow: hidden;
    }

    .group-title {
      font-size: 13px;
      font-weight: 700;
      color: #58a6ff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 12px 16px;
      background: #232323;
      border-bottom: 1px solid #2d2d2d;
    }

    .setting-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid #282828;
    }

    .setting-item:last-child {
      border-bottom: none;
    }

    .setting-info {
      flex: 1;
      padding-right: 16px;
    }

    .setting-label {
      font-size: 14px;
      font-weight: 500;
      color: #f0f6fc;
      margin-bottom: 2px;
    }

    .setting-desc {
      font-size: 11px;
      color: #8b949e;
      line-height: 1.4;
    }

    /* Switch toggle */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #30363d;
      transition: .2s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: #f0f6fc;
      transition: .2s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #1f6feb;
    }

    input:checked + .slider:before {
      transform: translateX(20px);
    }

    /* Form controls */
    .control-input {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #c9d1d9;
      padding: 6px 10px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
      min-width: 140px;
    }

    .control-input:focus {
      border-color: #58a6ff;
    }

    input[type="color"] {
      width: 42px;
      height: 32px;
      min-width: 42px;
      padding: 2px;
      cursor: pointer;
      border-radius: 6px;
    }

    select.control-input {
      cursor: pointer;
      min-width: 160px;
    }

    /* Right Preview Area */
    #widget-container {
      flex: 1;
      height: 100vh;
      position: relative;
      background-color: #1a1a1a;
      background-image:
        linear-gradient(45deg, #222222 25%, transparent 25%),
        linear-gradient(-45deg, #222222 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #222222 75%),
        linear-gradient(-45deg, transparent 75%, #222222 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    }

    #widget {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div id="sidebar">
    <div id="pinned-header">
      <h2>Widget URL</h2>
      <input id="widget-url" type="text" readonly>
      <div class="btn-row">
        <button id="copy-btn" class="btn btn-copy" onclick="copyWidgetUrl()">Click to copy URL</button>
        <button class="btn btn-reset" onclick="resetToDefaults()" title="Reset all settings to default values">Reset</button>
      </div>
    </div>
    <div id="settings-content">
      <!-- Generated dynamically from settings.json -->
    </div>
  </div>

  <div id="widget-container">
    <iframe id="widget"></iframe>
  </div>

  <script src="script.js"></script>
</body>
</html>
